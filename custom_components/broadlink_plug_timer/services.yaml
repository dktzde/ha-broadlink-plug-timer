# Actions of Broadlink Plug Timer. Names and descriptions: translations/en.json.
# Every action names one plug by its switch entity of the core Broadlink integration.

read:
  fields:
    entity_id: &plug
      required: true
      selector:
        entity:
          integration: broadlink
          domain: switch

set_deadman:
  fields:
    entity_id: *plug
    minutes:
      required: true
      example: 8
      selector:
        number:
          min: 1
          max: 1440
          step: 0.5
          mode: box
          unit_of_measurement: min

clear_deadman:
  fields:
    entity_id: *plug

set_once:
  fields:
    entity_id: *plug
    on_time:
      required: true
      example: "2026-11-07 10:00:00"
      selector:
        datetime:
    off_time:
      required: true
      example: "2026-11-07 10:05:00"
      selector:
        datetime:

write_weekly:
  fields:
    entity_id: *plug
    entries:
      required: true
      example: '[{"days": "mon-fri", "on_time": "06:30", "off_time": "06:35"}]'
      selector:
        object:
    dry_run:
      default: false
      selector:
        boolean:

backup:
  fields:
    entity_id: *plug

restore:
  fields:
    entity_id: *plug
    file:
      required: true
      example: "a1b2c3d4e5f6_20261105_220924.bin"
      selector:
        text:
