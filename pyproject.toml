# Only tool settings; the integration itself is installed by copying custom_components/.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# Same import order as Home Assistant core
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components"]
section-order = ["future", "standard-library", "third-party", "homeassistant", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
homeassistant = ["homeassistant"]
